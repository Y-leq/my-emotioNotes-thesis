# ============ EmotioNotes 毕设项目配置 ============

# 数据集路径配置
dataset:
  deam_annotations_dir: "./DEAM_Annotations/annotations"  # 静态/动态标注 CSV 目录
  deam_audio_dir: "./DEAM_audio"                          # 音频根目录（会递归搜索 mp3）
  deam_features_dir: "./features"
  
# 预处理配置（方案A：直接使用 DEAM 原生 45s 片段，不二次切分）
preprocessing:
  target_sr: 44100              # 目标采样率 (Hz)
  use_native_duration: true     # true=保留 45s 原长，不裁剪
  mono: true                    # 是否转为单声道
  trim_db: 30                   # 静音检测阈值（首尾轻量裁剪）
  
# 数据集划分配置
splitting:
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  random_seed: 42
  
# 音频→文本模型配置
audio_to_text:
  provider: "dashscope"
  model_name: "qwen2-audio-instruct"
  endpoint: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  api_key: "sk-694950b044d94131bd9babfc29f84cd0"
  temperature: 0.2
  max_tokens: 220
  clip_seconds: 30
  max_samples: null  # null = 对测试集全部片段生成描述（约 180 条，耗时长、计费多）
  request_timeout: 180
  
# LLM 配置（情感推理：二阶段大模型。OpenAI 请设置环境变量 OPENAI_API_KEY，勿将密钥提交到仓库）
llm:
  provider: "aliyun"  # aliyun | openai | gitcode | atomgit
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 官方；Azure/代理可改为对应兼容端点
  model_name: "qwen-plus-latest"  # 可改为 gpt-4o、gpt-4.1 等
  api_key: "sk-694950b044d94131bd9babfc29f84cd0"  # 优先使用环境变量 OPENAI_API_KEY；仅本地调试可临时填写
  temperature: 0.7
  max_tokens: 200
  max_samples: null  # null = 处理描述文件中全部行（须先完成全量 test_descriptions_real.csv）
  
# 质量评估配置
quality_assessment:
  auto_min_length: 50
  manual_sample_rate: 0.1  # 10%抽检
  manual_score_threshold: 3.0  # 满分5分
  
# 输出路径配置
output:
  processed_audio_dir: "./data/processed_audio"
  descriptions_dir: "./data/descriptions"
  emotions_dir: "./data/emotions"
  features_dir: "./data/features"
  splits_dir: "./data/splits"
  results_dir: "./results"
  
# 提示词版本：与产物目录一一对应，便于论文写「提示词迭代」
#   - 预测: data/emotions/llm_predictions_test_{version}.csv
#   - 评测: results/prompt_runs/{version}/llm_eval_*.json|csv
#   - 图:   results/visualizations/prompt_runs/{version}/*.png
# 改文案并跑新实验时递增 version（如 v4→v5），旧版文件保留即可留作对比。
# profiles：供 python src/llm_inference.py --version v1 使用，无需手改上面的 version 行。
# 论文递进：v1 → v3 → v4 效价反偏置 → v5（v4 口径+纯 JSON 纪律+连续数值提示）
# 音频转文本与情感提示词**独立**版本化：
#   - audio_description_version + audio_description_profiles → 提示词文件
#   - 描述表：data/descriptions/test_descriptions_real_{audio_description_version}.csv
#   - 可 python src/audio_to_text.py --audio-version v4；llm 侧 python src/llm_inference.py --audio-version v4 --version v5
#   若设 audio_description_file 为非 null 路径，则该文件优先生效，但仍用 audio_description_version 作为描述 CSV 后缀。
# 旧的无后缀 test_descriptions_real.csv：llm_inference 会在版本化文件不存在时回退并 [WARN]。
prompts:
  version: "v5"
  audio_description_version: "v4"
  audio_description_file: null
  audio_description_profiles:
    v2: "./prompts/audio_description_v2.txt"
    v3: "./prompts/audio_description_v3.txt"
    v4: "./prompts/audio_description_v4.txt"
    v5: "./prompts/audio_description_v5.txt"
  llm_system_file: "./prompts/llm_emotion_system_v5.txt"
  llm_user_template_file: "./prompts/llm_emotion_user_v5.txt"
  profiles:
    v1:
      llm_system_file: "./prompts/llm_emotion_system_v1.txt"
      llm_user_template_file: "./prompts/llm_emotion_user_v1.txt"
    v3:
      llm_system_file: "./prompts/llm_emotion_system_v3.txt"
      llm_user_template_file: "./prompts/llm_emotion_user_v3.txt"
    v4:
      llm_system_file: "./prompts/llm_emotion_system_v4.txt"
      llm_user_template_file: "./prompts/llm_emotion_user_v4.txt"
    v5:
      llm_system_file: "./prompts/llm_emotion_system_v5.txt"
      llm_user_template_file: "./prompts/llm_emotion_user_v5.txt"

# 日志配置
logging:
  level: "INFO"
  log_file: "./logs/experiment.log"